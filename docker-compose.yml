services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: email-abuse-backend
    ports:
      - "8000:8000"
    environment:
      # Production: set DATABASE_URL in your deployment environment.
      # Local fallback keeps current docker-compose behavior with db service.
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/email_abuse}
      # Worker tuning: auto by CPU cores (clamped by MIN/MAX).
      # To force a fixed value, set WEB_CONCURRENCY in your env.
      - MIN_WORKERS=${MIN_WORKERS:-2}
      - MAX_WORKERS=${MAX_WORKERS:-8}
      - BACKEND_BASE_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:8501
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: email-abuse-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: email-abuse-db
    environment:
      - POSTGRES_DB=email_abuse
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d email_abuse"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
